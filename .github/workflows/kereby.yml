name: Kereby
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tjek Kereby
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          python3 - <<'EOF'
          import os, re, json, sys, urllib.request, urllib.parse
          req = urllib.request.Request("https://kereby.dk/bolig/", headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode()
          found = re.findall(r'(?:https://kereby\.dk)?/bolig/[a-z0-9-]+/', html)
          links = {l if l.startswith("http") else "https://kereby.dk" + l for l in found}
          if not links:
              sys.exit("Ingen boliger fundet")
          first = not os.path.exists("seen.json")
          seen = set() if first else set(json.load(open("seen.json")))
          def notify(msg):
              url = os.environ["NOTIFY_URL"] + "&body=" + urllib.parse.quote(msg)
              urllib.request.urlopen(url, timeout=30)
          if first:
              notify("Kereby-overvågning er sat op")
          else:
              for l in sorted(links - seen):
                  notify("Ny bolig på Kereby: " + l)
          json.dump(sorted(seen | links), open("seen.json", "w"))
          EOF
      - name: Gem
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add seen.json
          git diff --staged --quiet || (git commit -m "opdater" && git push)
